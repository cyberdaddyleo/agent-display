<style>
/* Layout: 系列外壳 —— 每个主题是一块铺满视口的独立画面（各自的 Shadow DOM，样式和 id 互不干扰），外壳只负责切换和记住选择。
   主题自己的按钮里有「主题」入口，打开下面的选择面板；T 键快速轮换。外壳的面板固定用深色，盖在任何主题上都清楚。 */
:root{
  color-scheme:dark;
  --page:#07080d; --sheet:rgba(10,11,16,.96); --sheet-line:#262a39; --sheet-ink:#eef0f7; --sheet-mute:#7d8298;
  --acc:#45e6f5; --acc-2:#ff3f8e; --scrim:rgba(3,4,8,.6);
  --mono:"JetBrains Mono","Noto Sans SC","PingFang SC",ui-monospace,Menlo,monospace;
  --display:"Archivo","Noto Sans SC",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--page);overflow:hidden}
.th-host{position:relative;height:100%}
.picker{position:fixed;z-index:100;inset:0;display:grid;place-items:center;background:var(--scrim);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.pk{width:min(560px,100%);box-sizing:border-box;background:var(--sheet);border:1px solid var(--sheet-line);border-radius:8px;padding:16px 16px 12px;font-family:var(--mono);color:var(--sheet-ink);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.pk-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.pk-h b{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.01em}
.pk-h span{font-size:10px;letter-spacing:.16em;color:var(--sheet-mute);flex:1}
.pk-x{font:700 13px/1 var(--mono);color:var(--sheet-mute);background:none;border:1px solid var(--sheet-line);border-radius:4px;padding:5px 8px;cursor:pointer}
.pk-x:hover{color:var(--sheet-ink);border-color:var(--sheet-ink)}
.pk-list{display:grid;gap:8px}
.tcard{display:grid;grid-template-columns:84px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;box-sizing:border-box;text-align:left;font:inherit;color:inherit;background:transparent;border:1px solid var(--sheet-line);border-radius:6px;padding:8px 12px 8px 8px;cursor:pointer}
.tcard:hover{border-color:var(--acc)}
.tcard:focus-visible,.pk-x:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tcard[aria-current="true"]{border-color:var(--acc-2);box-shadow:inset 0 0 0 1px var(--acc-2)}
.tcard em{font-style:normal;font-size:10px;letter-spacing:.12em;color:var(--acc-2);visibility:hidden}
.tcard[aria-current="true"] em{visibility:visible}
.tn{display:grid;gap:3px;min-width:0}
.tn b{font-size:13px;font-weight:800;letter-spacing:.04em}
.tn small{font-size:10.5px;color:var(--sheet-mute);font-family:"Noto Sans SC",var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:84px;height:48px;border-radius:4px;display:block;box-sizing:border-box}
.sw-ops{background:radial-gradient(circle at -30% 55%,transparent 58%,#151515 58.6% 59.6%,transparent 60.2% 77%,#151515 77.6% 78.4%,transparent 79%),repeating-linear-gradient(-28deg,transparent 0 9px,rgba(21,21,21,.18) 9px 10px),#eeede8}
.sw-spider{border:4px solid #ec4fae;background:linear-gradient(118deg,transparent 46%,#45e6f5 47% 48.5%,transparent 49.5%),linear-gradient(62deg,transparent 54%,#45e6f5 55% 56.5%,transparent 57.5%),radial-gradient(circle at 51% 50%,#ff3f8e 0 3px,transparent 3.5px),#0b0c12}
.sw-neural{background:radial-gradient(circle at 50% 50%,rgba(240,246,255,.95) 0 2px,rgba(170,205,255,.45) 4px,rgba(120,160,220,.12) 10px,transparent 13px),radial-gradient(circle at 50% 50%,transparent 15px,rgba(220,236,255,.85) 15.5px 16.5px,transparent 17px 18.5px,rgba(220,236,255,.5) 19px 21px,transparent 21.5px 22.5px,rgba(220,236,255,.3) 23px 23.6px,transparent 24px),#04060b}
.sw-factory{background:linear-gradient(90deg,transparent 10px,#ffc21a 10px 12px,transparent 12px 72px,#ffc21a 72px 74px,transparent 74px),linear-gradient(180deg,transparent 9px,#ffc21a 9px 11px,transparent 11px 37px,#ffc21a 37px 39px,transparent 39px),radial-gradient(ellipse 6px 12px at 50% 46%,#e6e9ee 0 60%,transparent 64%),linear-gradient(90deg,#2fd27a 0 8px,transparent 8px 76px,#3b7cff 76px),repeating-linear-gradient(90deg,#1a212b 0 10px,#151b23 10px 20px)}
.sw-nebula{background:radial-gradient(circle at 50% 54%,#fff 0 2px,rgba(255,255,255,.0) 2.5px),radial-gradient(circle at 44% 54%,rgba(240,248,255,.95) 0 1.6px,transparent 2px),radial-gradient(circle at 56% 54%,rgba(240,248,255,.95) 0 1.6px,transparent 2px),radial-gradient(circle at 50% 55%,rgba(200,225,255,.55) 0 7px,transparent 8px),radial-gradient(ellipse 15px 11px at 50% 38%,rgba(255,190,160,.55),transparent 70%),radial-gradient(circle at 18% 30%,rgba(124,200,255,.65) 0 2px,rgba(124,200,255,.18) 7px,transparent 10px),radial-gradient(circle at 82% 66%,rgba(255,134,194,.6) 0 2px,rgba(255,134,194,.16) 7px,transparent 10px),radial-gradient(circle at 80% 24%,rgba(255,210,122,.55) 0 1.5px,rgba(255,210,122,.14) 6px,transparent 9px),radial-gradient(circle at 22% 74%,rgba(160,147,255,.6) 0 1.5px,rgba(160,147,255,.16) 6px,transparent 9px),radial-gradient(ellipse at 50% 50%,rgba(60,90,170,.35),transparent 75%),#03050c}
.sw-forge{background:radial-gradient(circle at 58% 50%,#020306 0 8px,rgba(235,244,255,.95) 8.6px 9.6px,rgba(156,208,255,.35) 10px 13px,transparent 14px),radial-gradient(ellipse 34px 13px at 58% 50%,rgba(255,173,94,.38),transparent 72%),repeating-linear-gradient(8deg,transparent 0 4px,rgba(143,227,185,.16) 4px 5px),linear-gradient(90deg,#0a0d12 0 22%,#05070a 22%)}
.tcard.next{cursor:default;border-style:dashed;opacity:.55}
.tcard.next:hover{border-color:var(--sheet-line)}
.sw-next{border:1px dashed var(--sheet-mute);background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(125,130,152,.15) 6px 7px)}
.pk-f{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:9.5px;letter-spacing:.08em;color:var(--sheet-mute);flex-wrap:wrap}
@media (max-width:480px){.tcard{grid-template-columns:64px minmax(0,1fr)}.sw{width:64px;height:40px}.tcard em{display:none}}
</style>

<!-- ===== 主题 01 · OPS 纸面工程（原 Agent Ops 调度大屏） ===== -->
<template id="tpl-ops">
<style>
/* Layout: 纸面工程图式大屏 —— 顶部指标轨 + 圆心偏左的大弧舞台（静止的汇聚连线 / 快速旋转的飞轮：环带数据块 + 外射谱线）+ 底部 2×4 仪表面板。浅色 = 纸与墨，深色 = 夜间荧光绿 */
:host{
  --bg:#eeede8; --panel:#f6f5f1; --band:#eeede8;
  --ink:#151515; --ink2:#4a4a46; --mute:#86857f; --hair:#d2d0c9; --hair2:#e4e2dc;
  --accent:#151515; --bar:#151515; --chip-fg:#f6f5f1; --scan:transparent;
  --c-line:#151515; --c-hi:#000000; --c-hot:#000000; --c-text:#1a1a1a; --c-dim:#7d7c77;
  --font:"JetBrains Mono","Noto Sans SC",ui-monospace,Menlo,monospace;
  --cjk:"Noto Sans SC","JetBrains Mono",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:host(:not([data-theme="light"])){
  --bg:#030605; --panel:#06100c; --band:#040a08;
  --ink:#c3f8e2; --ink2:#5fd6a6; --mute:#4c9f7f; --hair:#143327; --hair2:#0c1f17;
  --accent:#7dffd0; --bar:#5fd6a6; --chip-fg:#03100b; --scan:rgba(125,255,208,.022);
  --c-line:#34d996; --c-hi:#e6fff4; --c-hot:#3dffa6; --c-text:#a6efcf; --c-dim:#3d8f6f;
  color-scheme:dark }}
:host([data-theme="dark"]){
  --bg:#030605; --panel:#06100c; --band:#040a08;
  --ink:#c3f8e2; --ink2:#5fd6a6; --mute:#4c9f7f; --hair:#143327; --hair2:#0c1f17;
  --accent:#7dffd0; --bar:#5fd6a6; --chip-fg:#03100b; --scan:rgba(125,255,208,.022);
  --c-line:#34d996; --c-hi:#e6fff4; --c-hot:#3dffa6; --c-text:#a6efcf; --c-dim:#3d8f6f;
  color-scheme:dark }

:host{display:block;height:100%;overflow:auto}
[hidden]{display:none!important}
:host{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:11px;-webkit-font-smoothing:antialiased}
.app{min-height:100%;box-sizing:border-box;display:grid;grid-template-rows:minmax(440px,1fr) auto;gap:10px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 顶部指标轨 */
.top{position:absolute;z-index:3;left:0;top:0;display:grid;grid-template-columns:repeat(3,minmax(86px,auto));gap:12px 26px;align-items:end;padding:14px 48px 34px 16px;pointer-events:none;text-shadow:0 0 2px var(--bg),0 0 6px var(--bg),0 0 12px var(--bg);background:radial-gradient(farthest-side at 0 0,color-mix(in srgb,var(--bg) 82%,transparent),color-mix(in srgb,var(--bg) 45%,transparent) 62%,transparent)}
.top .title{grid-column:1 / -1}
.cell{position:relative;min-width:0;padding-bottom:7px;border-bottom:1px solid var(--hair)}
.stat{min-width:86px}
.cell::after{content:"";position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--accent);transition:width .9s ease}
.cell.on::after{width:100%}
.title::after{width:100%;height:2px;background:var(--ink)}
.title h1{margin:0;font-weight:800;font-size:clamp(16px,1.5vw,23px);letter-spacing:.02em;line-height:1.1;white-space:nowrap}
.title h1 .zh{font-family:var(--cjk);font-weight:700;letter-spacing:.04em}
.title p{margin:5px 0 0;font-size:8.5px;letter-spacing:.14em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title p b{color:var(--ink2);font-weight:500;font-variant-numeric:tabular-nums}
.stat .k{display:block;font-size:8px;letter-spacing:.16em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .k i{font-style:normal;font-family:var(--cjk);letter-spacing:.04em;margin-left:5px}
.stat .v{display:block;margin-top:6px;font-size:clamp(13px,1.05vw,16px);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{color:var(--mute);font-size:.78em}
.ctls{position:absolute;z-index:4;top:14px;right:14px;display:flex;gap:6px}
.btn{font:inherit;font-size:10px;letter-spacing:.1em;color:var(--ink);background:transparent;border:1px solid var(--mute);padding:5px 10px;cursor:pointer;white-space:nowrap;font-family:var(--cjk)}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible,.seg button:focus-visible,#pc:focus-visible{outline:1px solid var(--accent);outline-offset:2px}

/* 舞台 */
.stage{position:relative;min-height:0;overflow:hidden;background:var(--bg)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,var(--scan) 0 1px,transparent 1px 3px)}
.note{position:absolute;z-index:2;right:14px;bottom:14px;display:grid;gap:4px;min-width:220px;border-left:2px solid var(--ink);padding:4px 4px 4px 12px;pointer-events:none;text-shadow:0 0 2px var(--bg),0 0 6px var(--bg),0 0 12px var(--bg)}
.note .nh{font-size:8px;letter-spacing:.14em;color:var(--mute);border-bottom:1px solid var(--hair);padding-bottom:5px;white-space:nowrap}
.note b{font-size:12.5px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums;font-family:var(--font);white-space:nowrap}
.note .ns{font-size:9px;color:var(--mute);font-family:var(--cjk)}
.hud{position:absolute;z-index:2;right:14px;bottom:96px;display:grid;gap:3px;border-left:2px solid var(--ink);padding:3px 4px 3px 12px;font-size:8.5px;letter-spacing:.1em;color:var(--mute);white-space:nowrap;pointer-events:none;text-shadow:0 0 2px var(--bg),0 0 6px var(--bg),0 0 12px var(--bg)}
.hud b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.hud .warn{color:var(--accent);font-weight:700}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--panel);border:1px solid var(--ink);padding:6px 9px;font-size:10.5px;line-height:1.55;font-family:var(--cjk);max-width:250px}
.tip b{font-family:var(--font);font-weight:700;margin-right:6px}
.tip span{display:block;color:var(--mute);font-family:var(--font);font-size:9px}

/* 面板 */
.panels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.panel{min-width:0;height:184px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--hair);padding:9px 11px 8px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;min-width:0}
.ph h2{margin:0;font-size:9px;font-weight:800;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ph h2 i{font-style:normal;font-family:var(--cjk);font-weight:500;color:var(--mute);letter-spacing:.06em;margin-left:6px}
.ph span{font-size:8.5px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.pb{flex:1;min-height:0;position:relative;overflow:hidden}
.pb canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pf{margin-top:6px;font-size:8px;letter-spacing:.1em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf b{color:var(--ink);font-weight:500}

.feed{list-style:none;margin:0;padding:0;height:100%;font-size:9.5px;line-height:13.5px}
.feed li{display:grid;grid-template-columns:2.4em 3.4em minmax(0,1fr);gap:8px;white-space:nowrap}
.feed .n{color:var(--mute);font-variant-numeric:tabular-nums}
.feed .vb{color:var(--ink2)}
.feed .d{overflow:hidden;text-overflow:ellipsis;font-family:var(--cjk)}
.feed li:last-child{font-weight:700}
.feed li:last-child .d{font-weight:700}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:7px}
.seg button{font:inherit;font-size:8px;letter-spacing:.14em;padding:4px 0;border:1px solid var(--hair);background:transparent;color:var(--ink2);cursor:pointer}
.seg button:hover{border-color:var(--ink)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--chip-fg)}
#pc{cursor:crosshair}

.code{margin:0;height:100%;font-size:9.5px;line-height:13px;overflow:hidden}
.code .row{display:block;white-space:pre}
.code .row.cur{background:var(--hair2)}
.code .ln{color:var(--mute);margin-right:12px;user-select:none}
.code .kw{font-weight:800}
.code .str{color:var(--ink2)}
.code .cm{color:var(--mute)}
.caret{display:inline-block;width:.6em;height:11px;vertical-align:-2px;background:var(--ink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.agents{list-style:none;margin:0;padding:0;height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(6,minmax(0,1fr));grid-auto-flow:column;column-gap:16px}
.agents li{display:grid;grid-template-columns:1.7em 2.3em minmax(0,1fr);gap:6px;align-items:center;font-size:9.5px;min-width:0}
.agents .n{color:var(--mute);font-variant-numeric:tabular-nums}
.agents .r{font-family:var(--cjk)}
.agents li.idle .r{color:var(--mute)}
.agents .b{display:grid;gap:2px;min-width:0}
.agents .b b{display:block;height:5px;background:var(--hair2);position:relative;overflow:hidden}
.agents .b b i{position:absolute;left:0;top:0;bottom:0;background:var(--bar);transition:width .6s ease}
.agents .b small{font-size:7.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}

@media (max-width:1100px){
  .panels{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .app{grid-template-rows:auto auto}
  .top{right:0;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px;padding:10px 10px 18px}
  .top .title{box-sizing:border-box;padding-right:178px}
  .stat{min-width:0}
  .ctls{right:10px;top:10px}
  .stage{height:150vw;max-height:720px}
  .note{right:10px;bottom:10px;min-width:0;max-width:calc(100% - 20px);box-sizing:border-box}
  .hud{display:none}

/* ---------- 倒计时 / 发射横幅 ---------- */
.count{position:absolute;left:50%;top:calc((100% - 244px * var(--bs,.5)) / 2);transform:translate(-50%,-50%) scale(var(--cs,1));transform-origin:50% 50%;text-align:center;white-space:nowrap;pointer-events:none;text-shadow:0 0 30px rgba(255,138,58,.6),0 0 4px #000}
.count::before{content:"";position:absolute;inset:-20px -90px -24px;z-index:-1;background:radial-gradient(closest-side,rgba(3,6,10,.7),rgba(3,6,10,0))}
.count b{display:block;font-family:var(--stencil);font-weight:900;font-size:210px;line-height:1;color:var(--hz)}
.count span{display:block;margin-top:4px;font-family:var(--cjk);font-weight:900;font-size:26px;letter-spacing:.3em;color:var(--ink)}
.banner{position:absolute;left:50%;top:calc((100% - 244px * var(--bs,.5)) / 2);transform:translate(-50%,-50%) scale(var(--cs,1));transform-origin:50% 50%;text-align:center;pointer-events:none;padding:14px 34px 16px;background:rgba(7,9,13,.82);border:1px solid rgba(255,194,26,.6);box-shadow:0 0 40px -10px rgba(255,194,26,.6)}
.banner::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(-45deg,var(--hz) 0 6px,var(--hz-ink) 6px 12px)}

/* ---------- 悬停提示 ---------- */
.tip{position:absolute;z-index:5;pointer-events:none;min-width:200px;max-width:290px;background:rgba(7,9,13,.94);border:1px solid var(--hair2);border-left:2px solid var(--c,#fff);padding:8px 11px;font-size:11px;line-height:1.6;font-family:var(--cjk);color:var(--ink2)}

/* ---------- 窄屏 / 竖屏 ---------- */

.m-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--hair2);padding-top:8px;margin-top:8px}
.m-stats div{display:grid;gap:2px;min-width:0}
.m-stats span{font-size:9px;letter-spacing:.12em;color:var(--mute);white-space:nowrap}

.glfail{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:340px;text-align:center;font-family:var(--cjk);font-size:13px;line-height:1.7;color:var(--ink2);border:1px solid var(--hair2);padding:14px 18px;background:rgba(7,9,13,.85)}

<style>
/* Layout: 整屏是一片星云 —— 正中是 CHIEF 的丝带星核，四周 12 团彩色星云各代表一个智能体。
   每来一个新需求，星云蛛按工作流在相关智能体的星云之间一跳一跳地移动，伸触须逐字读词：普通词连线，模糊词标红、问 CHIEF、补成具体要求，评分随之上涨；
   审完跳回星核，沿跳过时拉出的丝线派单。镜头默认跟着星云蛛走。HUD：左上标题 + 当前章节，右上数据栏 + 流程标签，底部六个玻璃框体。深空单一深色。 */
:host{
  color-scheme:dark;
  --bg:#03050c; --ink:#eaf1ff; --ink2:#a7b5d2; --mute:#5f6d8a; --dim:#343e58;

  --mono:"JetBrains Mono","Noto Sans SC","PingFang SC",ui-monospace,Menlo,monospace;
  --cjk:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
:host{display:block;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.gl.drag{cursor:grabbing}
.gl.hov{cursor:pointer}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 45%,transparent 58%,rgba(1,2,6,.5) 86%,rgba(1,2,6,.8))}
.fit{position:absolute;inset:0;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}

.hd h1{margin:12px 0 0;font-family:var(--display);font-weight:700;font-size:44px;line-height:1.06;letter-spacing:.05em;color:var(--fg)}
.hd h1 span{display:block;width:max-content;white-space:nowrap}
.hd h1 .l1{display:flex;align-items:center;width:max-content}
.hd h1 em{font-style:normal;font-family:var(--cjk);font-weight:900;font-size:36px;line-height:1;letter-spacing:.08em;margin-left:22px;text-shadow:none;background:linear-gradient(90deg,#b8dcff,#ffad5e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 10px rgba(255,173,94,.3))}
.sub{width:max-content;margin-top:12px;font-family:var(--cjk);font-size:14px;letter-spacing:.06em;color:var(--fg-2);white-space:nowrap}
.sub2{width:max-content;margin-top:6px;font-size:10px;letter-spacing:.16em;color:var(--fg-3);white-space:nowrap}
.sub2 b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- 右上按钮（与 03–05 同款） ---------- */
.tools{position:absolute;right:24px;top:14px;display:flex;gap:6px}
button.tb{font:500 11px/1 var(--mono);letter-spacing:.1em;color:var(--fg-2);background:rgba(6,9,14,.75);border:1px solid rgba(160,195,235,.3);padding:8px 11px;cursor:pointer;white-space:nowrap}
button.tb b{color:var(--fg);font-weight:700;font-family:var(--cjk);margin-left:6px;letter-spacing:.04em}
button.tb:hover{border-color:var(--ice);color:var(--fg)}
button.tb:focus-visible{outline:1px solid var(--ice);outline-offset:2px}
.strip{position:absolute;right:24px;top:52px;display:flex;gap:16px;font-size:9.5px;letter-spacing:.12em;color:var(--fg-3);white-space:nowrap}
.strip b{color:var(--fg);font-weight:500;margin-left:5px;font-variant-numeric:tabular-nums}
.strip .live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px;box-shadow:0 0 6px var(--ok)}

/* ---------- 框体 ---------- */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);min-width:0;min-height:0}
.panel::before,.panel::after{content:"";position:absolute;width:9px;height:9px;pointer-events:none;border:1px solid var(--line-2)}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 12px 7px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.14em;color:var(--fg-3);white-space:nowrap}
.ph>span:first-child{color:var(--fg-2);overflow:hidden;text-overflow:ellipsis}
.ph b{color:var(--fg);font-weight:500;margin-right:2px}

/* 左：子 Agent 阵列 */
.col-l{position:absolute;left:24px;top:206px;bottom:246px;width:396px;display:flex;flex-direction:column}
.agents{flex:1;display:grid;grid-template-rows:repeat(8,minmax(0,1fr));gap:6px;padding:8px 11px 10px 10px;min-height:0}
.ag{position:relative;display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid rgba(160,190,220,.08);transition:border-color .5s,box-shadow .5s}
.ag-h{display:flex;justify-content:space-between;align-items:center;background:var(--c);color:var(--ink);font-size:10px;font-weight:700;letter-spacing:.05em;line-height:14px;padding:1px 7px;opacity:.82;transition:opacity .4s}
.ag-b{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;padding:1px 7px 2px;min-height:0}
.ag-r{display:grid;grid-template-columns:auto minmax(0,1fr) 28px auto minmax(0,1fr) 28px;align-items:center;gap:5px;font-size:9px;line-height:12px;color:var(--fg-3);font-family:var(--cjk)}
.bar{display:block;height:5px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c);opacity:.6;transition:width .12s linear}
.v{color:var(--fg-2);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.ag-r2{display:flex;align-items:center;gap:8px;font-size:9.5px;line-height:13px;color:var(--fg-2);min-width:0}
.ag-r2 .role{flex:none;font-family:var(--cjk)}
.ag-r2 .task{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--fg-3);font-family:var(--cjk)}
.st{flex:none;font-size:8px;line-height:11px;letter-spacing:.12em;padding:0 5px;border:1px solid var(--line-2);color:var(--fg-3)}
.ag-r3{display:flex;align-items:flex-end;gap:2px;height:8px}
.ag-r3 i{flex:1;background:var(--c);opacity:.38;min-height:1px}
.port{position:absolute;right:-5px;top:50%;width:8px;height:8px;margin-top:-4px;border:1px solid var(--c);background:var(--c);opacity:.35;box-shadow:0 0 8px var(--c);transition:opacity .1s}
.ag::after{content:"";position:absolute;right:-2px;top:16%;bottom:16%;width:2px;background:repeating-linear-gradient(to bottom,var(--c) 0 1px,transparent 1px 4px);opacity:.55;animation:fgtick .35s linear infinite}
@keyframes fgtick{from{background-position:0 0}to{background-position:0 4px}}
.ag.busy .st{color:var(--fg-2)}
.ag.on{border-color:var(--c);box-shadow:0 0 22px -10px var(--c)}
.ag.on .ag-h{opacity:1}
.ag.on .st{color:var(--c);border-color:var(--c)}
.ag.on .port{background:var(--c)}
.ag.on .ag-r2 .task{color:var(--fg)}
.ag.on .ag-r3 i{opacity:.7}

/* 中：星核 HUD */
.stage{position:absolute;left:444px;right:504px;top:0;bottom:246px}
.hud-top{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;width:660px}
.job-line{font-size:9.5px;letter-spacing:.18em;color:var(--fg-3);white-space:nowrap}
.job-line .id{color:var(--fg-2)}
.job-line .sep{margin:0 8px;opacity:.6}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;gap:7px}
.steps li{position:relative;display:flex;align-items:baseline;gap:6px;padding-bottom:6px;font-size:9px;color:var(--fg-3);letter-spacing:.1em;white-space:nowrap;transition:color .4s}
.steps .sl{font-family:var(--cjk);font-size:12.5px;letter-spacing:.08em}
.steps .se{font-size:8px;opacity:.8}
.steps i{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(160,190,220,.16)}
.steps i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--fg-2);transform-origin:left center;transform:scaleX(var(--p,0))}
.steps li.done{color:var(--fg-2)}
.steps li.on{color:var(--fg)}
.steps li.on i::after{background:var(--ice);box-shadow:0 0 6px var(--ice)}
.steps li.on.hot i::after{background:var(--hot);box-shadow:0 0 6px var(--hot)}
.hint{font-size:8.5px;letter-spacing:.14em;color:var(--fg-3);opacity:.75;white-space:nowrap}
.hud-bl{position:absolute;left:56px;bottom:10px;max-width:56%}
.eyebrow{font-size:9px;letter-spacing:.2em;color:var(--fg-3);margin-bottom:7px;white-space:nowrap}
.eyebrow i{display:inline-block;width:6px;height:6px;background:var(--hot);margin-right:8px;vertical-align:1px;animation:fgblink 1.2s infinite}
.now-title{font-family:var(--cjk);font-size:30px;font-weight:700;letter-spacing:.02em;line-height:1.12;white-space:nowrap;text-shadow:0 0 12px var(--bg)}
.now-sub{font-size:10px;color:var(--fg-2);margin-top:7px;letter-spacing:.04em;font-family:var(--cjk);white-space:nowrap}
.hud-br{position:absolute;right:56px;bottom:10px;text-align:right}
.big{font-family:var(--mono);font-size:46px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums;color:var(--fg);letter-spacing:-.02em}
.big small{font-size:16px;color:var(--fg-3);margin-left:4px}
.cap{font-size:8.5px;letter-spacing:.18em;color:var(--fg-3);margin-top:6px;white-space:nowrap}
@keyframes fgblink{0%,100%{opacity:1}50%{opacity:.3}}

/* 右：锻造工位 */
.col-r{position:absolute;right:24px;top:80px;bottom:246px;width:456px;display:flex;flex-direction:column;gap:12px}
.bay{flex:1;display:flex;flex-direction:column}
.bay-job{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 12px 8px;border-bottom:1px solid var(--line)}
.bj-id{font-size:9px;letter-spacing:.16em;color:var(--fg-3);white-space:nowrap}
.bj-pct{font-size:9px;color:var(--fg-2);text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.bj-t{grid-column:1/-1;font-family:var(--cjk);font-size:16px;font-weight:700;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bj-bar{grid-column:1/-1;height:3px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.bj-bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--ice),var(--hot))}
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:8px 10px 2px}
.pc{position:relative;display:flex;flex-direction:column;gap:3px;padding:6px 8px 7px;border:1px solid rgba(160,190,220,.1);background:var(--card);cursor:pointer;min-width:0;overflow:hidden;transition:border-color .35s,background .35s,box-shadow .35s;font:inherit;color:inherit;text-align:left}
.pc.wide{grid-column:1/-1}
.pc-t{display:flex;justify-content:space-between;gap:6px;font-size:8.5px;letter-spacing:.08em;color:var(--fg-3);white-space:nowrap}
.pc-n{overflow:hidden;text-overflow:ellipsis}
.pc-s{flex:none;font-size:8px;letter-spacing:.14em}
.pc-task{font-size:13px;color:var(--fg);font-family:var(--cjk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-m{display:flex;align-items:center;gap:6px;font-size:8.5px;color:var(--fg-3);white-space:nowrap}
.pc-m .dot{width:6px;height:6px;background:var(--c);flex:none}
.pc-pct{margin-left:auto;color:var(--fg-2);font-variant-numeric:tabular-nums}
.pc-bar{height:2px;background:rgba(255,255,255,.07);position:relative;overflow:hidden;margin-top:1px}
.pc-bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--fg-3)}
.pc:hover{border-color:rgba(160,190,220,.3)}
.pc:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
.pc.hot{border-color:rgba(255,173,94,.75);background:rgba(38,22,8,.6);box-shadow:inset 0 0 26px -14px var(--hot)}
.pc.hot .pc-s,.pc.hot .pc-pct{color:var(--hot)}
.pc.hot .pc-bar i{background:var(--hot)}
.pc.done .pc-s{color:var(--ice)}
.pc.done .pc-bar i{background:var(--ice)}
.pc.focus{border-color:var(--fg)}
.op{flex:1;display:flex;flex-direction:column;gap:7px;margin:8px 10px 10px;padding:9px 10px 9px;border:1px solid rgba(160,190,220,.1);background:linear-gradient(180deg,rgba(156,208,255,.05),transparent 70%);min-height:0;overflow:hidden}
.op-h{display:flex;justify-content:space-between;gap:8px;font-size:8.5px;letter-spacing:.16em;color:var(--fg-3);white-space:nowrap}
.op-h b{color:var(--c,var(--fg-2));font-weight:500;letter-spacing:.08em}
.op-main{display:flex;align-items:center;gap:12px;min-width:0}
.op-code{font-family:var(--mono);font-size:34px;font-weight:400;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums;flex:none}
.op.hot .op-code{color:var(--hot)}
.op-txt{min-width:0}
.op-n{font-size:8.5px;letter-spacing:.14em;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op-t{font-family:var(--cjk);font-size:15px;font-weight:500;color:var(--fg);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.op-steps li{position:relative;padding-top:6px;font-size:8.5px;color:var(--fg-3);font-family:var(--cjk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op-steps li::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.08)}
.op-steps li.done{color:var(--fg-2)}
.op-steps li.done::before{background:var(--ice)}
.op-steps li.on{color:var(--fg)}
.op-steps li.on::before{background:linear-gradient(90deg,var(--hot) var(--sp,0%),rgba(255,255,255,.08) var(--sp,0%))}
.op-cap{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.14em;color:var(--fg-3);margin-top:2px}
.op-cap b{font-weight:400;color:var(--fg-2);font-variant-numeric:tabular-nums}
.op-wave{flex:1;display:flex;align-items:flex-end;gap:2px;min-height:14px;border-bottom:1px solid rgba(160,190,220,.12)}
.op-wave i{flex:1;background:var(--fg-3);opacity:.35;min-height:1px}
.op.hot .op-wave i{background:var(--hot);opacity:.6}
.op-m{display:flex;justify-content:space-between;gap:8px;font-size:8px;letter-spacing:.12em;color:var(--fg-3);white-space:nowrap}
.op-m b{display:block;font-family:var(--mono);font-size:14px;font-weight:400;letter-spacing:.02em;color:var(--fg-2);margin-top:2px;font-variant-numeric:tabular-nums}
.deliv{flex:none;display:flex;flex-direction:column}
.dl{display:flex;flex-direction:column;padding:4px 12px 7px;font-size:9px}
.dr{display:grid;grid-template-columns:40px 64px minmax(0,1fr) 40px;gap:9px;padding:5px 0;border-bottom:1px dashed rgba(160,190,220,.09);color:var(--fg-3);align-items:baseline;white-space:nowrap}
.dr:last-child{border-bottom:0}
.dr .t{color:var(--fg-2);font-family:var(--cjk);font-size:10.5px;overflow:hidden;text-overflow:ellipsis}
.dr .d{text-align:right;font-variant-numeric:tabular-nums}
.dr.new{animation:fgflash 2.2s ease-out}
.dr.new .t{color:var(--fg)}
@keyframes fgflash{0%{background:rgba(255,173,94,.18)}100%{background:transparent}}

/* 底：四块遥测 */
.bottom{position:absolute;left:24px;right:24px;bottom:36px;height:198px;display:grid;grid-template-columns:1.25fr 1fr 1.15fr 1fr;gap:12px}
.bottom>.panel{display:flex;flex-direction:column;overflow:hidden}
.log{flex:1;padding:6px 12px;font-size:9px;line-height:16px;overflow:hidden;color:var(--fg-3);min-height:0}
.lr{display:grid;grid-template-columns:52px 66px 52px minmax(0,1fr);gap:8px;white-space:nowrap}
.lr .a{color:var(--c)}
.lr .vb{color:var(--fg-2);letter-spacing:.06em}
.lr .x{color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;font-family:var(--cjk)}
.lr.fresh .x{color:var(--fg)}
.disp{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);column-gap:16px;padding:6px 12px 8px;min-height:0;align-items:center}
.dpr{display:grid;grid-template-columns:70px minmax(0,1fr) 16px;gap:7px;align-items:center;font-size:8.5px;color:var(--fg-3)}
.dpr .n{color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dpr .bar{height:5px}
.dpr .q{text-align:right;color:var(--fg-2);font-variant-numeric:tabular-nums}
.code{flex:1;margin:0;padding:6px 10px 6px 0;list-style:none;font:400 9.5px/13px var(--mono);color:#7f8b9a;overflow:hidden;min-height:0}
.code.sc{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 26px);mask-image:linear-gradient(180deg,transparent 0,#000 26px)}
.code li{white-space:pre;overflow:hidden;text-overflow:ellipsis}
.code li::before{content:attr(data-n);display:inline-block;width:4ch;padding-right:12px;text-align:right;color:var(--fg-3);opacity:.75}
.code li.hl{color:var(--fg);background:linear-gradient(90deg,rgba(156,208,255,.12),transparent 90%);box-shadow:inset 2px 0 0 var(--ice)}
.code li.hl.hot{background:linear-gradient(90deg,rgba(255,173,94,.13),transparent 90%);box-shadow:inset 2px 0 0 var(--hot)}
.code li.hl::before{color:var(--fg-2);opacity:1}
.code li.cur::after{content:"\258C";color:var(--ice);margin-left:1px;animation:fcblink 1s steps(1) infinite}
.code li.cur.hot::after{color:var(--hot)}
.code li.cur.tp::after{animation:none}
@keyframes fcblink{50%{opacity:0}}
.code .xk{color:#b9a6ff}
.code .xf{color:var(--ice)}
.code .xs{color:#e8c18f}
.code .xn{color:#8fe3b9}
.code .xc{color:#66727f;font-family:var(--cjk)}
.tele{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto auto minmax(0,1fr);gap:5px 14px;padding:7px 12px 8px;min-height:0}
.tv{display:flex;flex-direction:column;gap:2px;min-width:0}
.tk{font-size:8px;letter-spacing:.14em;color:var(--fg-3);white-space:nowrap;font-family:var(--cjk)}
.tn{font-family:var(--mono);font-size:21px;font-weight:400;color:var(--fg);font-variant-numeric:tabular-nums;line-height:1.08;white-space:nowrap}
.tn small{font-size:.6em;color:var(--fg-3);margin-left:3px}
.spark{grid-column:1/-1;width:100%;height:100%;min-height:18px;display:block}
.sb{position:absolute;left:24px;right:24px;bottom:9px;display:flex;align-items:center;justify-content:center;gap:28px;font-size:9.5px;letter-spacing:.14em;color:var(--fg-3);white-space:nowrap;overflow:hidden}
.sb b{color:var(--fg-2);font-weight:500;font-variant-numeric:tabular-nums}
.sb .on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:7px;vertical-align:1px;box-shadow:0 0 6px var(--ok)}
.sb .wm{font-family:var(--display);font-size:9px;letter-spacing:.3em;color:#3c4552}

/* ---------- 星核上的标注（在 board 外，按缩放比例同步缩放） ---------- */
.pl{position:absolute;left:0;top:0;width:160px;transform-origin:0 0;padding:5px 8px 6px;background:rgba(6,9,13,.86);border:1px solid rgba(156,208,255,.26);font-size:8.5px;color:var(--fg-2);pointer-events:auto;cursor:pointer;will-change:transform,opacity;transition:border-color .3s,background .3s}
.pl .h{display:flex;gap:6px;align-items:baseline;color:var(--fg);font-size:9px;letter-spacing:.05em;white-space:nowrap}
.pl .h b{color:var(--ice);font-weight:500}
.pl .h span{font-family:var(--cjk);font-size:10.5px}
.pl .h em{font-style:normal;color:var(--fg-3);font-size:7.5px;letter-spacing:.12em;margin-left:auto}
.pl .k{margin-top:3px;display:flex;justify-content:space-between;gap:6px;font-family:var(--cjk);font-size:9.5px;color:var(--fg-3);white-space:nowrap}
.pl .k .p{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--fg-2)}
.pl.hot{border-color:var(--hot);background:rgba(34,19,6,.9)}
.pl.hot .h b,.pl.hot .k .p{color:var(--hot)}
.pl.hot .k{color:var(--fg)}
.pl.done{border-color:rgba(156,208,255,.45)}
.pl.done .k .p{color:var(--ice)}
.pl.focus{border-color:var(--fg);background:rgba(14,20,28,.94)}
.ol{position:absolute;left:0;top:0;transform-origin:0 0;font-size:8.5px;letter-spacing:.14em;color:var(--fg-2);white-space:nowrap;will-change:transform,opacity}
.ol i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:1px;box-shadow:0 0 6px var(--c)}

/* ---------- 窄屏 / 竖屏 ---------- */
.mini{display:none;position:absolute;inset:0;flex-direction:column;justify-content:space-between;pointer-events:none;padding-block:10px}
.narrow .board{display:none}
.narrow .mini{display:flex}
.m-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.m-title{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.05em;line-height:1.1;text-shadow:0 0 8px var(--bg)}
.m-title i{display:block;font-style:normal;font-family:var(--cjk);font-weight:700;font-size:12px;color:var(--hot);letter-spacing:.12em;margin-top:5px}
.m-btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;max-width:210px}
.m-btns .tb{padding:6px 8px;font-size:10px}

<script>
/* ===== 主题 01 · OPS 纸面工程 ===== */
function mountOps(host, SR){
'use strict';

/* ================= 1. 数据配置（换成你自己的内容即可） ================= */
const CONFIG = {
  agents: [['01','检索'],['02','拆解'],['03','文案'],['04','设计'],['05','代码'],['06','测试'],
           ['07','审校'],['08','数据'],['09','剪辑'],['10','投放'],['11','客服'],['12','归档']],
  taskNames: ['竞品资料检索','需求拆解','短视频脚本','封面图六版','落地页改版','接口联调','合同条款审校','周报数据汇总',
              '投标文件生成','私域话术更新','素材归档','发版检查','用户反馈聚类','广告素材测试','知识库更新','直播切片'],
  workflows: ['资料检索','需求拆解','脚本生成','视觉设计','代码实现','测试验证','合规审校','数据汇总','视频剪辑','投放优化','知识归档'],
  // 执行代码面板：多套示例，随机轮换，一轮内不重复。agent = 对应 agents 的序号（0 起）
  codeSets: [
    {file: 'dispatch.py', agent: 1, start: 7, lines: [
      "# 每日调度：拆任务、派给智能体",
      "tasks = load_queue('今日')",
      "plan = split(tasks, by='skill')",
      "for step in plan:",
      "    agent = dispatch(step.skill)",
      "    out = agent.run(step)",
      "    if review(out) < 0.8:",
      "        out = agent.revise(out)",
      "    board.attach(step.id, out)"]},
    {file: 'retrieve.py', agent: 0, start: 18, lines: [
      "# 竞品资料检索",
      "def retrieve(topic, k=20):",
      "    hits = search.web(topic, top=k)",
      "    docs = [fetch(h.url) for h in hits]",
      "    docs = dedupe(docs, by='title')",
      "    notes = summarize(docs, lang='zh')",
      "    kb.save(topic, notes)",
      "    return notes"]},
    {file: 'script.py', agent: 2, start: 31, lines: [
      "# 短视频脚本：钩子 + 正文 + 互动",
      "def write_script(topic, pains):",
      "    hook = pick_hook(pains, max_s=5)",
      "    body = outline(topic, beats=4)",
      "    cta = ask_for_comment(topic)",
      "    draft = llm.write(hook, body, cta)",
      "    return polish(draft, tone='口语')"]},
    {file: 'cover.py', agent: 3, start: 42, lines: [
      "# 封面图六版，挑最佳",
      "specs = brief.cover_specs()",
      "imgs = []",
      "for i in range(6):",
      "    imgs.append(img.gen(specs, seed=i))",
      "scores = [rate(x, specs) for x in imgs]",
      "best = imgs[argmax(scores)]",
      "export(best, size='1080x1440')"]},
    {file: 'tender.py', agent: 6, start: 56, lines: [
      "# 投标文件：按甲方要求逐条响应",
      "reqs = parse_tender('招标文件.pdf')",
      "doc = Template('投标模板.docx')",
      "for r in reqs:",
      "    ans = draft_response(r, kb)",
      "    doc.fill(r.id, ans)",
      "missing = doc.check_required(reqs)",
      "assert not missing, missing",
      "doc.save('投标文件_v3.docx')"]},
    {file: 'weekly.py', agent: 7, start: 64, lines: [
      "# 周报数据汇总",
      "rows = db.query('tasks', week=42)",
      "done = [r for r in rows if r.done]",
      "rate = len(done) / len(rows)",
      "chart = plot.bar(group(done, 'agent'))",
      "report.add('完成率', f'{rate:.0%}')",
      "report.add_chart(chart)",
      "report.send(to='周报群')"]},
    {file: 'preflight.py', agent: 5, start: 77, lines: [
      "# 发版前检查",
      "def preflight(build):",
      "    tests = run_tests(build, fast=True)",
      "    if tests.failed:",
      "        return block(tests.failed)",
      "    diff = compare(build, last_release)",
      "    if diff.risk > 0.3:",
      "        return ask_review(diff)",
      "    return approve(build)"]},
    {file: 'ads_ab.py', agent: 9, start: 88, lines: [
      "# 广告素材测试：小预算跑 AB",
      "variants = load_creatives('第3批')",
      "for v in variants:",
      "    ads.launch(v, budget=200)",
      "wait(hours=24)",
      "stats = ads.report(variants)",
      "win = max(stats, key=lambda s: s.ctr)",
      "ads.scale(win, budget=2000)"]},
    {file: 'archive.py', agent: 11, start: 95, lines: [
      "# 素材归档与知识库更新",
      "files = scan('素材/本周')",
      "for f in files:",
      "    tags = vision.tag(f)",
      "    kb.index(f, tags=tags)",
      "    move(f, to=f'归档/{tags[0]}')",
      "log.info(f'归档 {len(files)} 个文件')"]}
  ]
};
const CODEBITS = ['eqs = extract(spec.p)','solve(grid, dt=0.004)','log(claim, consts)','assert stable(state)','check_mass(state, ref)',
  'flag(blind_spots)','drift = compare(out, ref)','rerun(scene_07)','cite(page=12)','metric = spec.metric()','state = step(inputs)',
  'out = agent.run(step)','score = review(out)','board.attach(id, out)','route(task, skill)','queue.push(task)'];

/* 飞轮转速（弧度/秒），越大转得越快 */
const SPIN = 0.16;

/* ================= 2. 工具 ================= */
const $ = s => SR.querySelector(s);
const TAU = Math.PI * 2;
const FONT = '"JetBrains Mono","Noto Sans SC",ui-monospace,Menlo,monospace';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const root = host;
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = (rr, a) => a[(rr() * a.length) | 0];
const pad2 = n => String(n).padStart(2, '0');
const hms = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
const wrapPI = a => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const rgba = (hex, a) => { let h = hex.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
function fitCv(cv, ctx){ const r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2); const w = Math.max(1, r.width), h = Math.max(1, r.height); cv.width = Math.round(w * d); cv.height = Math.round(h * d); ctx.setTransform(d, 0, 0, d, 0, 0); return [w, h]; }
function qd(c, q){ c.beginPath(); c.moveTo(q.x1, q.y1); c.quadraticCurveTo(q.cx, q.cy, q.x2, q.y2); c.stroke(); }
function bez(q, u){ const v = 1 - u; return [v*v*q.x1 + 2*v*u*q.cx + u*u*q.x2, v*v*q.y1 + 2*v*u*q.cy + u*u*q.y2]; }

/* 主题：颜色全部来自 CSS 变量 */
let T = {};
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : darkMQ.matches;
function readTheme(){
  const cs = getComputedStyle(root), g = n => cs.getPropertyValue(n).trim();
  T = {dark: isDark(), bg: g('--bg'), panel: g('--panel'), band: g('--band'), ink: g('--ink'), ink2: g('--ink2'), mute: g('--mute'),
       hair: g('--hair'), hair2: g('--hair2'), line: g('--c-line'), hi: g('--c-hi'), hot: g('--c-hot'), text: g('--c-text'), dim: g('--c-dim')};
  T.cell = T.dark ? T.ink2 : T.ink;
  themeBtn.textContent = T.dark ? '纸面' : '粒子';
  themeBtn.setAttribute('aria-label', T.dark ? '切换到纸面主题' : '切换到粒子主题');
}

/* ================= 3. 模拟引擎（接真实数据时替换这一段） ================= */
const R = mulberry32(20261016);
const NA = CONFIG.agents.length, NW = CONFIG.workflows.length;
const tasks = Array.from({length: 64}, (_, i) => ({i, id: 'T-' + String(i + 1).padStart(3, '0'),
  name: CONFIG.taskNames[(R() * CONFIG.taskNames.length) | 0], wf: (R() * NW) | 0, prog: 0, state: 'queued', agent: -1}));
const agents = CONFIG.agents.map(([code, name], i) => ({i, code, name, task: -1}));
const wfs = CONFIG.workflows.map((name, i) => ({i, id: 'W' + pad2(i + 1), name, q: 0, cells: Array.from({length: 16}, () => R())}));
[0.91, 0.86, 0.72, 0.88, 0.84, 0.69, 0.93, 0.82, 0.74, 0.87, 0.71].forEach((q, i) => wfs[i].q = q);
const order = tasks.map(t => t.i);
for (let i = order.length - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; [order[i], order[j]] = [order[j], order[i]]; }
order.slice(0, 22).forEach(i => { tasks[i].state = 'done'; tasks[i].prog = 1; });
order.slice(22, 32).forEach((i, k) => { const t = tasks[i]; t.state = 'run'; t.prog = 0.06 + R() * 0.85; t.agent = k; agents[k].task = i; });

const running = () => agents.filter(a => a.task >= 0).length;
const doneCount = () => tasks.filter(t => t.state === 'done').length;
const matched = () => wfs.filter(w => w.q >= 0.8).length;

let logN = 38;
const feed = [];
const VERB = {read: '读取', build: '生成', check: '核验', review: '复核'};
function log(verb, t){ feed.push({n: logN++, verb, text: `${VERB[verb]} ${t.name}`}); if (feed.length > 30) feed.shift(); }
order.slice(8, 20).forEach((i, k) => log(['read', 'build', 'check', 'review'][k % 4], tasks[i]));

function step(){
  for (const a of agents) {
    if (a.task < 0) continue;
    const t = tasks[a.task];
    t.prog = Math.min(1, t.prog + 0.03 + Math.random() * 0.08);
    if (t.prog >= 1) { t.state = 'done'; t.agent = -1; a.task = -1; log(Math.random() < 0.5 ? 'check' : 'review', t); }
  }
  for (const a of agents) {
    if (a.task >= 0 || Math.random() > 0.4) continue;
    const q = tasks.filter(t => t.state === 'queued');
    if (!q.length) break;
    const t = q[(Math.random() * q.length) | 0];
    t.state = 'run'; t.agent = a.i; t.prog = 0.02; a.task = t.i; log(Math.random() < 0.5 ? 'read' : 'build', t);
  }
  const done = tasks.filter(t => t.state === 'done');
  if (done.length > 54) for (let k = 0; k < 18; k++) { const t = done[(Math.random() * done.length) | 0]; t.state = 'queued'; t.prog = 0; }
  const w = wfs[(Math.random() * NW) | 0];
  w.q = Math.max(0.6, Math.min(0.97, w.q + (Math.random() - 0.38) * 0.05));
  w.cells[(Math.random() * 16) | 0] = Math.random();
  renderAll();
}

/* ================= 4. DOM 面板 ================= */
const themeBtn = $('#theme'), fullBtn = $('#full');
const feedEl = $('#feed'), agentsEl = $('#agents'), codeEl = $('#code');

function renderStats(){
  const run = running(), m = matched();
  $('#s1').innerHTML = `${run} <small>/ ${NA}</small>`;
  $('#s3').textContent = doneCount();
  $('#s4').innerHTML = `${m} <small>/ ${NW}</small>`;
  $('#s5').textContent = NW - m;
  $('#noteMain').textContent = `${m} / ${NW} 已匹配 · ${NW - m} 待复核`;
  $('#agMeta').textContent = `${NA - run} idle`;
}
function renderFeed(){
  const n = Math.max(4, Math.floor(feedEl.clientHeight / 13.5));
  feedEl.innerHTML = feed.slice(-n).map(e => `<li><span class="n">${String(e.n).padStart(3, '0')}</span><span class="vb">${e.verb}</span><span class="d">${e.text}</span></li>`).join('');
}
function renderAgents(){
  agentsEl.innerHTML = agents.map(a => {

function route(f, t){

}

/* --- Token 账本：在干活的智能体按各自速率烧 token（单价是示例） --- */
const PRICE = {inMiss: 2, inHit: .5, out: 8};                                    // ¥ / 百万 token
const TOKR = [25, 140, 90, 150, 110, 160, 30, 80, 60, 50, 40, 90, 25];          // 干活时每秒 token，按 AG 顺序
const INR  = [.8, .92, .7, .55, .6, .62, .75, .88, .8, .7, .75, .7, .85];       // 其中输入 token 占比
const BUDGET = 72000, SLOT = 2.5, NSLOT = 40;                                   // 预算线 token/min；每格秒数；格数

let tokIn = tokDay * .7, tokOut = tokDay - tokIn, cacheHit = .62, slotAcc = 0;

const slots = Array.from({length: NSLOT}, () => ({sec: SLOT, a: TOKR.map((r, i) => (i === 0 || Math.random() < .8) ? r * SLOT * rnd(.55, 1.45) : 0)}));
const sumTOKR = TOKR.reduce((p, v) => p + v, 0);
AG.slice(0, 13).forEach((a, i) => { a.tok = tokDay * TOKR[i] / sumTOKR * rnd(.85, 1.15); });
const costDay = () => (tokIn * (1 - cacheHit) * PRICE.inMiss + tokIn * cacheHit * PRICE.inHit + tokOut * PRICE.out) / 1e6;

function tokenStep(dt){

  slotAcc += dt;
  if (slotAcc >= SLOT) { slots.push({sec: slotAcc, a: slotCur.slice()}); slotCur.fill(0); slotAcc = 0; if (slots.length > NSLOT) slots.shift(); }
}

function simStep(dt){
  chiefT -= dt;
  if (chiefT <= 0) { chiefT = rnd(1.5, 2.8); if (tasks.length < 22) dispatch(); }
  for (const a of workers) {
    if (a.path.length) {
      const p = a.path[0], dx = p.x - a.x, dy = p.y - a.y, d = Math.hypot(dx, dy), st = 165 * dt;
      if (Math.abs(dx) > .5) a.look = Math.sign(dx);
      if (d <= st) { a.x = p.x; a.y = p.y; a.path.shift(); if (!a.path.length && a.after) { const f = a.after; a.after = null; f(); } }
      else { a.x += dx / d * st; a.y += dy / d * st; }
      continue;
    }
    if (a.carry) continue;
    if (!a.cur) {
      if (a.inbox.length) { if (a.at !== 'seat') goSeat(a); else startWork(a); }
      else if (a.at === 'seat') { a.idleT += dt; if (a.idleT > 7 && Math.random() < dt * .25) goLounge(a); }
    } else if (a.at === 'seat') {
      a.prog += dt / a.dur;
      if (a.prog >= 1) finishStage(a);
    }
  }
  for (let i = packets.length - 1; i >= 0; i--) { const k = packets[i]; k.t += dt / k.dur; if (k.t >= 1) { packets.splice(i, 1); k.done && k.done(); } }
  for (let i = papers.length - 1; i >= 0; i--) { const p = papers[i]; p.vy += 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.life -= dt; if (p.life <= 0) papers.splice(i, 1); }
  crawl.pages += Math.random() < dt * 3 ? 1 : 0;
  crawl.read += Math.random() < dt * 2.4 ? 1 : 0;
  const m = nowMin();
  if (m !== binMin) { binMin = m; bins.shift(); bins.push({d: 0, r: 0, tok: 0}); }
  tokenStep(dt);
}

function dispatch(){

function finishStage(a){

const probe = {p: null, a: null, b: null, c: null, u: 1, dur: 2, dwell: 1.2, trail: []};
function crawlerStep(dt){
  if (!probe.p) return;
  if (probe.u < 1) {
    probe.u = Math.min(1, probe.u + dt / probe.dur);
    const u = probe.u, v = 1 - u;
    probe.p.set(v * v * probe.a.x + 2 * v * u * probe.c.x + u * u * probe.b.x, v * v * probe.a.y + 2 * v * u * probe.c.y + u * u * probe.b.y, v * v * probe.a.z + 2 * v * u * probe.c.z + u * u * probe.b.z);
    if (probe.u >= 1) probeArrive();
  } else if ((probe.dwell -= dt) <= 0) probeNext();
}
function probeNext(){
  const busy = workers.filter(a => a.cur && a.i !== crawl.target);
  const k = busy.length && Math.random() < .8 ? pick(busy).i : 1 + ((Math.random() * 12) | 0);
  crawl.target = k;
  probe.a.copy(probe.p);
  const C = CL[k], out = new THREE.Vector3(C.x, C.y, 0).normalize();
  probe.b.set(C.x + out.x * .1, C.y + out.y * .1, C.z + .12);
  const mid = probe.a.clone().add(probe.b).multiplyScalar(.5), m = Math.hypot(mid.x, mid.y) || .01;
  probe.c.set(mid.x / m * 1.72, mid.y / m * 1.72, mid.z + rnd(-.3, .5));
  probe.u = 0; probe.dur = clamp(probe.a.distanceTo(probe.b) / 1.5, .9, 2.4);
}
function probeArrive(){
  probe.dwell = rnd(1.6, 3.0);
  crawl.patrols++; crawl.read += 1 + ((Math.random() * 6) | 0);
  scanAt(crawl.target);
  const a = AG[crawl.target];
  if (a.cur && Math.random() < .07) { crawl.bugs++; log(CRAWLER, '抓 bug', `${a.cur.id} ${a.cur.name} · 提醒 ${a.k}`, 'bad'); a.bad = .7; }
  else if (Math.random() < .2) log(CRAWLER, '巡检', `${a.k} · ${a.cur ? a.cur.id + ' 先读再派' : '待命中'}`);
}

function simStep(dt){
  simT += dt;
  chiefT -= dt;
  if (chiefT <= 0) { if (queueTotal() + inFlight() < 15) dispatch(); chiefDur = chiefT = rnd(1.2, 2.4); }
  for (const a of workers) {
    if (!a.cur && a.inbox.length) startWork(a);
    if (a.cur) { a.prog += dt / a.dur; if (a.prog >= 1) finishStage(a); }
  }
  // 信号前进；到站时把任务交给下一个
  for (let i = signals.length - 1; i >= 0; i--) {
    const s = signals[i];
    s.u += dt / s.dur;
    if (s.bun >= 0) bunHot[s.bun] = 1;
    if (s.mid && !s.midDone && s.u >= s.mid) { s.midDone = true; s.onMid(); }
    if (s.kind === 'ray' && glOK && !s.hit && s.u <= 1) { s.path(s.u, tmpV); const r = Math.hypot(tmpV.x, tmpV.y); if ((s.lr || 0) < HIT_R && r >= HIT_R) { s.hit = true; hitRing(Math.atan2(tmpV.y, tmpV.x) + spin.rotation.z, s.col); } s.lr = r; }
    if (s.u >= 1 && !s.done) { s.done = true; if (s.to >= 0) { AG[s.to].flash = 1; } if (s.cb) s.cb(); }
    if (s.u >= 1 + s.tr * s.gap) signals.splice(i, 1);
  }
  // token 账
  for (let i = 0; i < 13; i++) {
    const a = AG[i];
    if (!(i === 0 || a.cur)) continue;
    const amt = TOKR[i] * dt * rnd(.6, 1.4);
    a.tok += amt; tokDay += amt; tokIn += amt * INR[i]; tokOut += amt * (1 - INR[i]);
    slotTok += amt; tokWinCur += amt;
    if (i > 0) heatCur[i - 1] += amt;
  }
  cacheHit = clamp(cacheHit + (Math.random() - .5) * .01 * dt, .55, .7);
  if ((tokWinAcc += dt) >= 2.5) { tokWin.push(tokWinCur); tokWin.shift(); tokWinCur = 0; tokWinAcc = 0; }
  if ((heatAcc += dt) >= HEAT_SLOT) {
    heat.forEach((row, r) => { row.push(heatCur[r] / (TOKR[r + 1] * HEAT_SLOT)); row.shift(); heatCur[r] = 0; });
    heatAcc = 0;
  }
  if ((slotAcc += dt) >= SEG_SLOT) {
    slotVals[slotHead % NSEG] = clamp(slotTok / (sumTOKR * .78 * SEG_SLOT), .04, 1);
    slotHead++; slotAcc = 0; slotTok = 0;
  } else slotVals[slotHead % NSEG] = clamp(slotTok / (sumTOKR * .78 * SEG_SLOT), .02, 1);
  if ((rateAcc += dt) >= 1) { rateBins.push(rateCur); rateBins.shift(); rateCur = 0; rateAcc = 0; }
  crawlerStep(dt);
  partStep(dt);
}

    {l: HP * rc, f: arc(sx, -sz, -HP)},

    {l: 2 * sx, f: (u, o, r) => { r.x = sx - 2 * sx * u; r.z = hz + o; r.nx = 0; r.nz = 1; r.tx = -1; r.tz = 0; }},

    {l: HP * rc, f: arc(-sx, -sz, Math.PI)}

/* ---------- 静态网格合并：同材质的不动零件拼成一个网格，省绘制调用 ---------- */
function mergeStatic(){
  world.updateMatrixWorld(true);
  const groups = new Map();
  (function walk(o){
    if (o.userData.dyn) return;
    if (o.isMesh && !Array.isArray(o.material) && o.geometry.attributes.normal && o.geometry.attributes.uv) { const k = o.material.uuid + (o.castShadow ? 's' : ''); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(o); }
    o.children.slice().forEach(walk);
  })(world);
  groups.forEach(list => {
    if (list.length < 2) return;
    const parts = list.map(m => { const g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone(); g.applyMatrix4(m.matrixWorld); return g; });
    let n = 0; parts.forEach(g => n += g.attributes.position.count);
    const P = new Float32Array(n * 3), N = new Float32Array(n * 3), U = new Float32Array(n * 2); let o = 0;
    parts.forEach(g => { P.set(g.attributes.position.array, o * 3); N.set(g.attributes.normal.array, o * 3); U.set(g.attributes.uv.array, o * 2); o += g.attributes.position.count; g.dispose(); });
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(P, 3)); geo.setAttribute('normal', new THREE.BufferAttribute(N, 3)); geo.setAttribute('uv', new THREE.BufferAttribute(U, 2)); geo.computeBoundingSphere();
    const mm = new THREE.Mesh(geo, list[0].material); mm.castShadow = list[0].castShadow; mm.receiveShadow = true;
    list.forEach(m => m.parent.remove(m));
    world.add(mm);
  });
}

function pushHist() {

  }
}
function heartbeat() {
  var i = Math.floor(Math.random() * AGENTS.length), a = AGENTS[i], b = a.beat[Math.floor(Math.random() * a.beat.length)];
  var verbs = ["SYNC", "FETCH", "PARSE", "VERIFY", "EMBED"];
  AG[i].lastBeat = b;

function drawSpark() {

function drawGL(t) {

  gl.uniform1f(U(P_CORE, "uLine"), 0); gl.drawArrays(gl.POINTS, 0, N);

}

var dustT = 0, now = 0, last = 0, partOff = new Float32Array(30), partCtr = new Float32Array(30), partSpin = new Float32Array(10), partDone = new Float32Array(10), partHot = new Float32Array(10);
var rateAcc = 0;

  last = ts;

}

/* ================= 系列外壳：挂载主题、切换、记住选择 ================= */
(() => {
  'use strict';

    factory: {host: 'host-factory', tpl: 'tpl-factory', mount: mountFactory, deps: THREE_DEPS},
    nebula: {host: 'host-nebula', tpl: 'tpl-nebula', mount: mountNebula, deps: THREE_DEPS},
    forge:  {host: 'host-forge',  tpl: 'tpl-forge',  mount: mountForge}

  const ORDER = ['ops', 'spider', 'neural', 'factory', 'nebula', 'forge'], KEY = 'agent-series-theme';
  function loadScripts(list){
    return list.reduce((p, src) => p.then(() => new Promise(res => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = res; document.head.appendChild(s); })), Promise.resolve());
  }
  const mounted = {}, picker = document.getElementById('picker');
  let cur = null, lastFocus = null;
  function show(id){
